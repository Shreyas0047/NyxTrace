name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix backend
      - name: Lint
        run: npm run lint --prefix backend
      - name: Type check
        run: npm run build:check --prefix backend
      - name: Run tests
        run: npm test --prefix backend

  backend-windows:
    name: Backend Validation (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix backend
      - name: Type check
        run: npm run build:check --prefix backend
      - name: Run tests
        run: npm test --prefix backend
      - name: Verify start:prod script is cross-platform
        run: npm run build --prefix backend

  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Lint
        run: npm run lint --prefix frontend
      - name: Type check + Build
        run: npm run build:check --prefix frontend

  blockchain:
    name: Blockchain Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: blockchain/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix blockchain
      - name: Compile contracts
        run: npm run compile --prefix blockchain
      - name: Run tests
        run: npm test --prefix blockchain

  python-services:
    name: Python Services Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            ai-service/requirements.txt
            sandbox-agent-v2/requirements.txt
      - name: Install dependencies (AI Service)
        run: pip install -r ai-service/requirements.txt
      - name: Lint + SAST (AI Service)
        run: |
          ruff check ai-service/app --quiet
          bandit -r ai-service/app -ll --quiet
      - name: Compile check (AI Service)
        run: python -m compileall ai-service/app
      - name: Install dependencies (Sandbox Agent)
        run: pip install -r sandbox-agent-v2/requirements.txt
      - name: Lint + SAST (Sandbox Agent)
        run: |
          ruff check sandbox-agent-v2/agent --quiet
          bandit -r sandbox-agent-v2/agent -ll --quiet
      - name: Compile check (Sandbox Agent)
        run: python -m compileall sandbox-agent-v2/agent
