<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">NyxTrace AI-powered digital forensics</title>
  <desc id="desc">Live sandbox telemetry moves through AI threat analysis into blockchain-anchored forensic evidence.</desc>

  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070706"/>
      <stop offset=".52" stop-color="#0f0e0b"/>
      <stop offset="1" stop-color="#10130f"/>
    </linearGradient>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".1"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".095"/>
      <stop offset=".5" stop-color="#f5f0e6" stop-opacity=".025"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".012"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset=".55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="amberGlow">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".14"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow">
      <stop offset="0" stop-color="#34d399" stop-opacity=".13"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f5f0e6" stroke-opacity=".032"/>
    </pattern>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="terminalClip">
      <rect x="559" y="126" width="158" height="126" rx="12"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#night)"/>
  <rect width="1200" height="420" rx="30" fill="url(#grid)"/>
  <ellipse cx="630" cy="180" rx="330" ry="270" fill="url(#amberGlow)"/>
  <ellipse cx="888" cy="160" rx="310" ry="250" fill="url(#blueGlow)"/>
  <ellipse cx="1115" cy="318" rx="250" ry="190" fill="url(#greenGlow)"/>
  <path d="M0 300C207 254 395 302 566 272S927 231 1200 282V420H0Z" fill="url(#depth)"/>

  <!-- Low forensic signal field. -->
  <g fill="none" stroke="#f5f0e6" stroke-opacity=".055">
    <path d="M0 337c120-17 181 19 278 5s155-51 258-28 172 44 272 16 195-9 392 12"/>
    <path d="M0 359c118-15 190 20 287 7s154-47 258-25 170 42 270 17 195-8 385 10"/>
    <path d="M0 382c122-14 197 19 295 8s154-43 258-22 170 38 270 15 191-5 377 10"/>
  </g>
  <path d="M18 371C215 340 411 390 603 359s352-23 580 9" fill="none" stroke="#f5f0e6" stroke-opacity=".11" stroke-dasharray="13 16"/>

  <!-- Product statement. -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="62" y="74" fill="#fbbf24" font-size="13" font-weight="700" letter-spacing="3.3">FORENSIC INTELLIGENCE SYSTEM</text>
    <text x="58" y="145" fill="#f4f1e9" font-size="59" font-weight="680" letter-spacing="-2.6">NyxTrace</text>
    <text x="62" y="183" fill="#aaa397" font-size="18">Trace the attack. Preserve the truth.</text>

    <g transform="translate(62 220)">
      <rect width="106" height="34" rx="17" fill="#f59e0b" fill-opacity=".09" stroke="#f59e0b" stroke-opacity=".28"/>
      <circle cx="18" cy="17" r="4" fill="#f59e0b"/>
      <text x="31" y="22" fill="#fde1a6" font-size="12" font-weight="650">INGEST</text>
    </g>
    <g transform="translate(178 220)">
      <rect width="116" height="34" rx="17" fill="#60a5fa" fill-opacity=".08" stroke="#60a5fa" stroke-opacity=".25"/>
      <path d="M17 10v14m-7-7h14" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
      <text x="31" y="22" fill="#c9e1ff" font-size="12" font-weight="650">ANALYZE</text>
    </g>
    <g transform="translate(304 220)">
      <rect width="112" height="34" rx="17" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-opacity=".24"/>
      <path d="m12 17 4 4 8-9" fill="none" stroke="#6ee7b7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="31" y="22" fill="#b6f5d5" font-size="12" font-weight="650">ANCHOR</text>
    </g>

    <text x="62" y="301" fill="#6f6a60" font-size="12" letter-spacing="1.35">TELEMETRY + ARTIFACTS + IOCS</text>
    <text x="62" y="328" fill="#d7d1c7" font-size="14">AI correlation  /  Chain of custody  /  Tamper detection</text>
  </g>

  <!-- Live telemetry artifact. -->
  <g>
    <rect x="535" y="68" width="208" height="256" rx="25" fill="#090907" stroke="#f5f0e6" stroke-opacity=".16"/>
    <rect x="543" y="77" width="192" height="238" rx="19" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".065"/>
    <circle cx="560" cy="96" r="3" fill="#fb7185"/>
    <circle cx="571" cy="96" r="3" fill="#fbbf24"/>
    <circle cx="582" cy="96" r="3" fill="#34d399"/>
    <text x="604" y="100" fill="#777167" font-family="'SFMono-Regular',Consolas,monospace" font-size="8.5">sandbox / live</text>
    <text x="559" y="119" fill="#e5dfd5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="650">TELEMETRY STREAM</text>

    <g clip-path="url(#terminalClip)" font-family="'SFMono-Regular',Consolas,monospace">
      <rect x="559" y="126" width="158" height="126" rx="12" fill="#070706"/>
      <path d="M559 154h158M559 182h158M559 210h158M559 238h158" stroke="#f5f0e6" stroke-opacity=".04"/>
      <text x="570" y="145" fill="#6f6a60" font-size="8">12:40:08</text>
      <text x="616" y="145" fill="#fbbf24" font-size="8">PROC</text>
      <text x="650" y="145" fill="#a8a294" font-size="8">powershell</text>

      <text x="570" y="164" fill="#6f6a60" font-size="8">12:40:09</text>
      <text x="616" y="164" fill="#93c5fd" font-size="8">NET</text>
      <text x="650" y="164" fill="#a8a294" font-size="8">egress:443</text>

      <text x="570" y="183" fill="#6f6a60" font-size="8">12:40:10</text>
      <text x="616" y="183" fill="#fb7185" font-size="8">ALERT</text>
      <text x="650" y="183" fill="#a8a294" font-size="8">T1059.001</text>

      <text x="570" y="202" fill="#6f6a60" font-size="8">12:40:11</text>
      <text x="616" y="202" fill="#fbbf24" font-size="8">FILE</text>
      <text x="650" y="202" fill="#a8a294" font-size="8">payload.bin</text>

      <text x="570" y="221" fill="#6f6a60" font-size="8">12:40:12</text>
      <text x="616" y="221" fill="#34d399" font-size="8">HASH</text>
      <text x="650" y="221" fill="#a8a294" font-size="8">7f2a…e841</text>

      <rect x="566" y="230" width="144" height="2" rx="1" fill="#24211a"/>
      <rect x="566" y="230" width="58" height="2" rx="1" fill="#f59e0b">
        <animate attributeName="width" values="18;144;18" dur="4.8s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#f59e0b;#60a5fa;#34d399;#f59e0b" dur="4.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="559" y="265" width="158" height="31" rx="10" fill="#f59e0b" fill-opacity=".08" stroke="#f59e0b" stroke-opacity=".22"/>
    <circle cx="576" cy="280.5" r="4" fill="#f59e0b" filter="url(#glow)">
      <animate attributeName="opacity" values=".45;1;.45" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="588" y="284" fill="#ddd5c9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10">Evidence captured</text>
    <circle cx="639" cy="306" r="3" fill="#645f56"/>
  </g>

  <!-- Live investigation outcome. -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="782" y="58" width="356" height="266" rx="25" fill="url(#panel)" stroke="#f5f0e6" stroke-opacity=".14"/>
    <text x="806" y="88" fill="#777167" font-size="10" font-weight="700" letter-spacing="2">LIVE INVESTIGATION</text>
    <circle cx="1107" cy="82" r="5" fill="#34d399" filter="url(#glow)">
      <animate attributeName="r" values="4;6;4" dur="2.6s" repeatCount="indefinite"/>
    </circle>

    <g transform="translate(806 106)">
      <rect width="102" height="76" rx="15" fill="#090907" fill-opacity=".76" stroke="#60a5fa" stroke-opacity=".2"/>
      <path d="M18 51 31 36l11 8 17-25 20 17" fill="none" stroke="#617791" stroke-width="2"/>
      <circle cx="59" cy="19" r="7" fill="#fb7185" fill-opacity=".13" stroke="#fb7185"/>
      <path d="M59 15v5m0 3v1" stroke="#fb7185" stroke-width="1.5" stroke-linecap="round"/>
      <text x="17" y="66" fill="#bdb7ae" font-size="9">THREAT SIGNAL</text>
    </g>

    <path d="M920 144h43" fill="none" stroke="url(#flow)" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <circle cx="942" cy="144" r="4" fill="#93c5fd" filter="url(#glow)"/>

    <g transform="translate(974 106)">
      <rect width="140" height="76" rx="15" fill="#090907" fill-opacity=".76" stroke="#34d399" stroke-opacity=".22"/>
      <path d="M27 18 39 23v9c0 8-5 13-12 17-7-4-12-9-12-17v-9Z" fill="#34d399" fill-opacity=".07" stroke="#6ee7b7" stroke-width="1.3"/>
      <path d="m21 31 4 4 8-9" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="49" y="28" fill="#e4ded5" font-size="11" font-weight="650">ANCHORED</text>
      <text x="49" y="43" fill="#888177" font-size="9">Evidence Registry</text>
      <text x="49" y="59" fill="#6ee7b7" font-size="9" font-weight="650">HASH VERIFIED</text>
    </g>

    <line x1="806" y1="203" x2="1114" y2="203" stroke="#f5f0e6" stroke-opacity=".085"/>

    <g transform="translate(806 222)">
      <circle cx="9" cy="9" r="9" fill="#f59e0b" fill-opacity=".11"/>
      <path d="m5 9 3 3 5-6" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round"/>
      <text x="28" y="13" fill="#d7d1c7" font-size="11">Telemetry normalized and preserved</text>
    </g>
    <g transform="translate(806 253)">
      <circle cx="9" cy="9" r="9" fill="#60a5fa" fill-opacity=".11"/>
      <path d="M4 9h10M9 4v10" stroke="#93c5fd" stroke-width="1.3" stroke-linecap="round"/>
      <text x="28" y="13" fill="#d7d1c7" font-size="11">AI mapped behavior to MITRE ATT&amp;CK</text>
    </g>
    <g transform="translate(806 284)">
      <circle cx="9" cy="9" r="9" fill="#34d399" fill-opacity=".11"/>
      <path d="m5 9 3 3 5-6" fill="none" stroke="#6ee7b7" stroke-width="1.4" stroke-linecap="round"/>
      <text x="28" y="13" fill="#d7d1c7" font-size="11">Chain of custody remains intact</text>
    </g>
  </g>

  <!-- Evidence route into the investigation. -->
  <path d="M743 200c21 0 18-9 39-9" fill="none" stroke="url(#flow)" stroke-width="2.2" stroke-dasharray="5 7">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="1.7s" repeatCount="indefinite"/>
  </path>
  <circle cx="758" cy="197" r="4" fill="#fbbf24" filter="url(#glow)">
    <animate attributeName="cx" values="748;778" dur="1.7s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#f59e0b;#60a5fa" dur="1.7s" repeatCount="indefinite"/>
  </circle>

  <!-- A small sandbox marker grounds the scene in the actual workflow. -->
  <g transform="translate(326 343)">
    <rect x="-14" y="-10" width="28" height="21" rx="4" fill="#090907" stroke="#f59e0b" stroke-opacity=".55"/>
    <path d="M-8-4h16M-8 1h9M-8 6h13" stroke="#fbbf24" stroke-opacity=".55" stroke-width="1.2"/>
    <circle cx="16" cy="-8" r="3.5" fill="#34d399">
      <animate attributeName="opacity" values=".4;1;.4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="418.5" rx="29.25" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.5"/>
</svg>
